version: '3.8'

services:
  backend:
    build:
      context: ./SERVER
      dockerfile: Dockerfile
    container_name: vishwakarma_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=vishwakarma_production_super_secret_jwt_key_2026!
      - DATABASE_URL=sqlite:///./vishwakarma_platform.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - ./SERVER/storage:/app/storage
      - ./SERVER/static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 3
